[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "video-cook"
version = "0.8.0"
description = "Deterministic executor for the video-cooking skill pipeline. Handles yt-dlp download, whisperX transcription, ffmpeg burn, Demucs vocal separation, dub mixing, and mechanical shipment verification — so agents don't hand-assemble long commands."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "ChHsiching"}]
keywords = ["yt-dlp", "whisperx", "ffmpeg", "subtitles", "video", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Multimedia :: Video",
]
dependencies = []

[project.optional-dependencies]
# Heavy deps that only some subcommands need. Install with:
#   pip install video-cook[download]    # for cook download
#   pip install video-cook[transcribe]  # for cook transcribe
#   pip install video-cook[subtitle]    # for cook subtitles (word-boundary cutting)
#   pip install video-cook[dub]         # for cook dub measure-rate (energy VAD)
#   pip install video-cook[all]         # everything
download = ["yt-dlp>=2026.3.3"]
transcribe = ["whisperx>=3.8.0"]
# jieba keeps shorten's must-cut path from splitting words mid-way
# (「技」「能」). Optional: without it shorten degrades to the legacy
# width-only hard cut and warns on stderr.
subtitle = ["jieba>=0.42"]
# dub measure-rate's energy VAD: soundfile streams the wav in blocks,
# numpy does the per-block RMS. Optional: without them the command dies
# with a pip install hint.
dub = ["numpy", "soundfile"]
all = ["yt-dlp>=2026.3.3", "whisperx>=3.8.0", "jieba>=0.42", "numpy", "soundfile"]
dev = ["pytest>=7", "numpy", "soundfile", "jieba>=0.42"]

[project.scripts]
cook = "cook:main"

[project.urls]
Homepage = "https://github.com/ChHsiching/video-cook"
Repository = "https://github.com/ChHsiching/video-cook"

[tool.setuptools]
# cook.py stays a top-level module; the stage scripts it drives ship as the
# stages/ package (resolved by cook._stage_script — see docs/adr/): subtitle
# side in stages/subtitle (ticket 01), dub side in stages/dub (ticket 02).
py-modules = ["cook"]
packages = ["stages", "stages.subtitle", "stages.dub"]

[tool.pytest.ini_options]
testpaths = ["."]
